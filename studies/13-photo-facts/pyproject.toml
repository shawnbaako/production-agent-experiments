[project]
# Environment for EmbeddingGemma 2 (image vectors), the heads and the report.
# select, apilabel and qwenitems need only the standard library; qwen_modal.py runs on Modal.
name = "photo-facts"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.2",
    "torch==2.15.0",
    "torchvision==0.29.2",
    "pillow>=10.0",
    "transformers==5.22.1",
    "sentence-transformers==6.2.0",
]

[tool.uv]
package = false
